<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dogios — Galeria de Cachorros</title>
  <style>
    :root{
      --bg:#f7f8fb;
      --card:#ffffff;
      --accent:#ff6b6b;
      --muted:#666;
      --shadow: 0 6px 18px rgba(20,20,40,0.08);
      --radius:12px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    body{
      margin:0;
      background: linear-gradient(180deg,#eef2ff 0%, var(--bg) 100%);
      color:#111827;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:32px;
    }
    header{
      width:100%;
      max-width:1100px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:20px;
    }
    h1{
      font-size:1.6rem;
      margin:0;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .controls{
      display:flex;
      gap:8px;
    }
    button{
      background:var(--accent);
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      box-shadow: var(--shadow);
      font-weight:600;
    }
    button.secondary{
      background:transparent;
      color:var(--accent);
      border:2px solid rgba(255,107,107,0.14);
      font-weight:600;
      padding:8px 12px;
    }
    main{
      width:100%;
      max-width:1100px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap:18px;
    }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      transition:transform .16s ease, box-shadow .16s ease;
    }
    .card:hover{ transform:translateY(-6px); box-shadow: 0 12px 26px rgba(20,20,40,0.12); }
    .thumb{
      width:100%;
      height:160px;
      object-fit:cover;
      background:#eee;
    }
    .card-body{
      padding:12px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      flex:1;
    }
    .meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .name{
      font-weight:700;
      font-size:1rem;
    }
    .desc{
      color:var(--muted);
      font-size:.92rem;
      line-height:1.3;
    }
    .actions{
      display:flex;
      gap:8px;
      align-items:center;
      margin-top:auto;
    }
    .like{
      background:transparent;
      border:none;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:700;
      color:var(--muted);
    }
    .like.liked{ color:var(--accent); }
    .loader{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 0;
      color:var(--muted);
    }
    footer{
      margin-top:28px;
      color:var(--muted);
      font-size:.9rem;
    }

    @media (max-width:420px){
      .thumb{ height:140px; }
      header{ flex-direction:column; align-items:flex-start; gap:12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🐶 Dogios — Galeria de Cachorros</h1>
    <div class="controls">
      <button id="reloadBtn">Buscar novos dogios</button>
      <button id="downloadBtn" class="secondary">Salvar página</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid" aria-live="polite">
      <div class="loader" id="loader">Carregando dogios...</div>
    </div>
    <footer>
      Dica: clique em "Buscar novos dogios" para carregar outras imagens aleatórias. Fotos via Dog API (dog.ceo) ou placeholders locais como fallback.
    </footer>
  </main>

  <script>
    // Lista de nomes e descrições curtas para randomizar os cards
    const nomes = ["Bidu", "Luna", "Thor", "Maya", "Rex", "Nina", "Toby", "Zara", "Bento", "Pipoca"];
    const descricoes = [
      "Amigável e cheio de energia.",
      "Adora passeios e abraços.",
      "Brincalhão e inteligente.",
      "Coração gigante em um corpinho pequeno.",
      "Dorminhoco profissional.",
      "Caçador de bolinhas oficial.",
      "Companheiro leal e protetor.",
      "Explorador curioso.",
      "Carinhoso com crianças.",
      "Sorriso que derrete."
    ];

    const grid = document.getElementById('grid');
    const loader = document.getElementById('loader');
    const reloadBtn = document.getElementById('reloadBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Cria um card com imagem, nome e descrição
    function createCard(imageUrl){
      const div = document.createElement('article');
      div.className = 'card';

      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = imageUrl;
      img.alt = "Foto de dogio";
      img.loading = 'lazy';

      const body = document.createElement('div');
      body.className = 'card-body';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = nomes[Math.floor(Math.random()*nomes.length)];

      const age = document.createElement('div');
      age.style.fontSize = '.9rem';
      age.style.color = 'var(--muted)';
      age.textContent = Math.floor(Math.random()*10)+ " anos";

      meta.appendChild(name);
      meta.appendChild(age);

      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = descricoes[Math.floor(Math.random()*descricoes.length)];

      const actions = document.createElement('div');
      actions.className = 'actions';

      const likeBtn = document.createElement('button');
      likeBtn.className = 'like';
      likeBtn.innerHTML = '❤ <span class="count">0</span>';
      likeBtn.title = 'Curtir';

      likeBtn.addEventListener('click', () => {
        likeBtn.classList.toggle('liked');
        const span = likeBtn.querySelector('.count');
        let n = parseInt(span.textContent,10);
        span.textContent = likeBtn.classList.contains('liked') ? (n+1) : Math.max(0,n-1);
      });

      actions.appendChild(likeBtn);

      body.appendChild(meta);
      body.appendChild(desc);
      body.appendChild(actions);

      div.appendChild(img);
      div.appendChild(body);

      return div;
    }

    // Renderiza um conjunto de imagens (URLs)
    function render(images){
      grid.innerHTML = '';
      if(!images || images.length === 0){
        grid.innerHTML = '<div class="loader">Nenhum dogio encontrado.</div>';
        return;
      }
      images.forEach(url => {
        grid.appendChild(createCard(url));
      });
    }

    // Tenta buscar imagens da Dog CEO API; se falhar, usa placeholders do placedog.net
    async function fetchDogImages(count = 8){
      try{
        const res = await fetch('https://dog.ceo/api/breeds/image/random/' + count);
        if(!res.ok) throw new Error('API não respondeu');
        const data = await res.json();
        if(data && data.status === 'success' && Array.isArray(data.message)){
          return data.message;
        }
        throw new Error('Resposta inesperada da API');
      } catch(e){
        // fallback: placedog.net com query param randomizado
        const fallback = [];
        for(let i=0;i<count;i++){
          // placedog.net permite id para variar a imagem
          fallback.push('https://placedog.net/640/420?id=' + (100 + i));
        }
        return fallback;
      }
    }

    // Carrega e renderiza
    async function load(count = 8){
      loader.style.display = 'flex';
      try{
        const imgs = await fetchDogImages(count);
        render(imgs);
      } catch(err){
        grid.innerHTML = '<div class="loader">Erro ao carregar dogios.</div>';
        console.error(err);
      } finally {
        loader.style.display = 'none';
      }
    }

    reloadBtn.addEventListener('click', ()=> load(8));

    // Baixar a página atual como arquivo HTML
    downloadBtn.addEventListener('click', ()=>{
      const doc = '<!doctype html>\\n' + document.documentElement.outerHTML;
      const blob = new Blob([doc], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dogios.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // Carregar ao abrir
    load(8);
  </script>
</body>
</html>
